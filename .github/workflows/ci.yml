name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./build.sh

      - name: Verify bundle
        run: |
          test -x dist/MacMute.app/Contents/MacOS/MacMute
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" dist/MacMute.app/Contents/Info.plist
          codesign --verify --verbose dist/MacMute.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacMute-app
          path: dist/MacMute.app
